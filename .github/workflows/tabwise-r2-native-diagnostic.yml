# NONQUALIFYING. First push runs offline checks only. Native input requires a separately owner-approved
# exact packet in a repository variable AND a manual rerun of that exact run (attempt 2 only).
# This is diagnostic authorization, never independent W2a/native attestation or production admission.
name: tabwise-r2-native-diagnostic
on:
  push:
    branches: [diag/tabwise-r2-native]
permissions:
  contents: read
concurrency:
  group: tabwise-r2-native-diagnostic
  cancel-in-progress: false
jobs:
  checks:
    runs-on: windows-2025
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24.22.1
      - run: npm ci --ignore-scripts
      - run: npm --prefix web ci --ignore-scripts
      - run: npm --prefix packages/contracts ci --ignore-scripts
      - run: npx --no-install playwright install chromium
      - run: node --test diagnostics/r2-native/test.mjs
      - run: npm test
      - run: npm --prefix web test
      - run: npm --prefix packages/contracts test
      - run: node scripts/check-r1-baseline.mjs
      - run: node scripts/preflight.mjs --clean
      - run: npm --prefix web run build -- --webpack
      - run: npm --prefix web run typecheck
      - run: node --test web/test/recorder.browser.mjs
      - run: node diagnostics/r2-native/web-check.mjs
  native:
    needs: checks
    # Attempt 1 cannot execute native input even if a stale variable is present. The packet binds run ID,
    # exact SHA, actor, attempt 2, source digest, fixture, keys and bounds; later reruns cannot reuse it.
    if: github.run_attempt == 2 && vars.TABWISE_NATIVE_DIAGNOSTIC_APPROVAL != ''
    runs-on: windows-2025
    timeout-minutes: 22
    env:
      TABWISE_NATIVE_DIAGNOSTIC_APPROVAL: ${{ vars.TABWISE_NATIVE_DIAGNOSTIC_APPROVAL }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24.22.1
      - name: Refuse unless exact separate diagnostic approval is present
        run: node diagnostics/r2-native/run.mjs --check-only
      - name: Preserve an honest setup-failure checkpoint
        run: node diagnostics/r2-native/run.mjs --initialize
      - run: npm ci --ignore-scripts
      - run: npx --no-install guidepup setup --ci
      - run: npx --no-install guidepup install nvda
      - run: npx --no-install playwright install chromium
      - name: Genuine guarded native diagnostic with custody and failure preservation
        timeout-minutes: 7
        run: node diagnostics/r2-native/run.mjs
      - name: Preserve complete or failed raw native evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: native-r2-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/tabwise-r2-native-diagnostic/
          if-no-files-found: warn
          retention-days: 14
  verify:
    needs: native
    if: always() && needs.native.result != 'skipped'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24.22.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # existing project pin, v8.0.2
        with:
          name: native-r2-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/native-in
      - name: Recompute sealed source, attribution and refusal; reject tampering
        shell: bash
        run: node diagnostics/r2-native/verify.mjs "$RUNNER_TEMP/native-in" | tee "$RUNNER_TEMP/verification.json"
      - name: Preserve separate-runner verification result
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: native-r2-verification-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/verification.json
          if-no-files-found: warn
          retention-days: 14
