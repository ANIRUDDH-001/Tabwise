# NONQUALIFYING. First dispatch runs offline checks only. Native input requires a separately owner-approved
# exact packet in a repository variable AND a manual rerun of that exact run (attempt 2 only).
# This is diagnostic authorization, never independent W2a/native attestation or production admission.
name: tabwise-r2-native-diagnostic
on:
  workflow_dispatch:
    inputs:
      candidate_mode:
        description: 'Isolated saved-version candidate; never production qualification'
        type: boolean
        default: false
      candidate_request:
        description: 'Exact product-owned candidate request envelope (public saved spec only)'
        type: string
        default: ''
permissions:
  contents: read
concurrency:
  group: tabwise-r2-native-diagnostic
  cancel-in-progress: false
jobs:
  checks:
    runs-on: windows-2025
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24.22.1
      - name: Measure unchanged foreground helper stages without input
        run: node diagnostics/owner-v2/foreground-timing.mjs
      - run: npm ci --ignore-scripts
      - name: Qualify identity and R2 authorization, runtime, custody and evidence negatives
        run: node --test diagnostics/owner-v2/process-identity.test.mjs diagnostics/owner-v2/resolver.test.mjs diagnostics/r2-native/test.mjs diagnostics/r2-native/error-test.mjs diagnostics/r2-native/autopsy.test.mjs diagnostics/r2-native/boundaries.test.mjs diagnostics/r2-native/zero-key.test.mjs diagnostics/r2-native/startup-supervisor.test.mjs test/r2-runtime.test.mjs test/r2-runtime-class.test.mjs test/r2-lifecycle.test.mjs test/r2-completion-integrity.test.mjs test/r2-review.test.mjs test/r2-capture-receipts.test.mjs test/r2-payload-context.test.mjs test/tabwise-observer.test.mjs test/r2-evidence.test.mjs
      - run: node scripts/check-r1-baseline.mjs

  native:
    needs: checks
    # Attempt 1 cannot execute native input even if a stale variable is present. The packet binds run ID,
    # exact SHA, actor, attempt 2, source digest, fixture, keys and bounds; later reruns cannot reuse it.
    if: ${{ !inputs.candidate_mode && github.run_attempt == 2 && vars.TABWISE_NATIVE_DIAGNOSTIC_APPROVAL != '' }}
    runs-on: windows-2025
    timeout-minutes: 22
    env:
      TABWISE_NATIVE_DIAGNOSTIC_APPROVAL: ${{ vars.TABWISE_NATIVE_DIAGNOSTIC_APPROVAL }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24.22.1
      - name: Refuse unless exact separate diagnostic approval is present
        run: node diagnostics/r2-native/run.mjs --check-only
      - name: Preserve an honest setup-failure checkpoint
        run: node diagnostics/r2-native/run.mjs --initialize
      - run: npm ci --ignore-scripts
      - run: npx --no-install guidepup setup --ci
      - run: npx --no-install guidepup install nvda
      - run: npx --no-install playwright install chromium
      - name: Genuine guarded native diagnostic with custody and failure preservation
        timeout-minutes: 7
        run: node diagnostics/r2-native/run.mjs
      - name: Preserve complete or failed raw native evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: native-r2-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/tabwise-r2-native-diagnostic/
          if-no-files-found: warn
          retention-days: 14
  candidate-checks:
    if: inputs.candidate_mode
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      TABWISE_CANDIDATE_REQUEST_JSON: ${{ inputs.candidate_request }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24.22.1
      - name: Candidate authorization, durable consumption and unchanged production refusals
        run: node --test diagnostics/r2-candidate/*.test.mjs test/r2-admission.test.mjs
      - name: Record non-authorizing exact packet on initial dispatch
        if: github.run_attempt == 1
        run: node diagnostics/r2-candidate/run.mjs --bootstrap
      - name: Preserve initial review packet
        if: github.run_attempt == 1
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: candidate-bootstrap-${{ github.run_id }}
          path: ${{ runner.temp }}/tabwise-candidate-bootstrap/
          if-no-files-found: error
          retention-days: 14
  candidate-native:
    needs: [checks, candidate-checks]
    if: inputs.candidate_mode && github.run_attempt == 2 && vars.TABWISE_CANDIDATE_EXECUTION_APPROVAL != ''
    runs-on: windows-2025
    timeout-minutes: 22
    env:
      TABWISE_CANDIDATE_REQUEST_JSON: ${{ inputs.candidate_request }}
      TABWISE_CANDIDATE_EXECUTION_APPROVAL: ${{ vars.TABWISE_CANDIDATE_EXECUTION_APPROVAL }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24.22.1
      # Full frozen integrity includes installed upstream dependency bytes.
      # Install only the existing lockfile before preflight; no native setup/input.
      - run: npm ci --ignore-scripts
      - name: Check exact candidate permission before setup
        run: node diagnostics/r2-candidate/run.mjs --check-only
      - name: Preserve saved request before native setup
        run: node diagnostics/r2-candidate/run.mjs --initialize
      - run: npx --no-install guidepup setup --ci
      - run: npx --no-install guidepup install nvda
      - run: npx --no-install playwright install chromium
      - name: One-use candidate native session with existing process custody
        timeout-minutes: 7
        run: node diagnostics/r2-candidate/run.mjs --run
      - name: Preserve candidate originals including failed setup or native run
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: candidate-native-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/tabwise-r2-candidate-*/
          if-no-files-found: warn
          retention-days: 14
  candidate-verify:
    needs: candidate-native
    if: always() && needs.candidate-native.result != 'skipped'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24.22.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: candidate-native-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/candidate-in
      - name: Recompute candidate evidence and semantic tamper refusals
        shell: bash
        run: |
          set -o pipefail
          node diagnostics/r2-candidate/verify.mjs "$RUNNER_TEMP/candidate-in" "$GITHUB_WORKSPACE" | tee "$RUNNER_TEMP/candidate-readback.json"
      - name: Preserve separate-runner readback
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: candidate-readback-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/candidate-readback.json
          if-no-files-found: warn
          retention-days: 14
  verify:
    needs: native
    if: always() && needs.native.result != 'skipped'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24.22.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # existing project pin, v8.0.2
        with:
          name: native-r2-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/native-in
      - name: Recompute sealed source, attribution and refusal; reject tampering
        shell: bash
        run: node diagnostics/r2-native/verify.mjs "$RUNNER_TEMP/native-in" "$GITHUB_WORKSPACE" --integrity-only | tee "$RUNNER_TEMP/verification.json"
      - name: Preserve separate-runner verification result
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: native-r2-verification-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/verification.json
          if-no-files-found: warn
          retention-days: 14
