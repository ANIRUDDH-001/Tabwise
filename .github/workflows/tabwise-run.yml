# Review-blocked worker candidate. No live dispatch authorized (D-59).
name: tabwise-run
run-name: tabwise ${{ inputs.run_id }}
on:
  workflow_dispatch:
    inputs:
      run_id:
        description: Public run UUID
        required: true
        type: string
      spec_b64:
        description: Palette-only encoded specification
        required: true
        type: string
      spec_sha256:
        description: Exact specification SHA256
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: tabwise-run-${{ inputs.run_id }}
  cancel-in-progress: false
jobs:
  review-gate:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    runs-on: windows-2025
    # A setup-only ceiling, not a measured live NVDA execution timeout.
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24.22.1
      - name: Validate spec and refuse unreviewed binding
        env:
          TABWISE_RUN_ID: ${{ inputs.run_id }}
          TABWISE_SPEC_B64: ${{ inputs.spec_b64 }}
          TABWISE_SPEC_SHA256: ${{ inputs.spec_sha256 }}
        run: node scripts/tabwise-run.mjs
      - name: Upload bounded evidence if produced
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: tabwise-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/tabwise-evidence/
          if-no-files-found: ignore
          retention-days: 1
