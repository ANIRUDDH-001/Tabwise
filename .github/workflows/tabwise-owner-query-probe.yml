# Prepared only. Attempt 1 is offline; execution requires a fresh exact packet and owner rerun.
name: tabwise-owner-query-probe
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: tabwise-owner-query-probe
  cancel-in-progress: false
jobs:
  review:
    runs-on: windows-2025
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24.22.1
      - run: node --test diagnostics/r2-native/cancellation.test.mjs diagnostics/r2-native/probe-cli.test.mjs diagnostics/r2-native/external-trace.test.mjs diagnostics/r2-native/boundaries.test.mjs diagnostics/r2-native/zero-key.test.mjs diagnostics/r2-native/startup-supervisor.test.mjs
      - name: Exact future attempt 2 packet, no execution
        shell: pwsh
        run: node diagnostics/r2-native/probe-entry.mjs --packet $env:GITHUB_RUN_ID
  probe:
    needs: review
    if: github.run_attempt == 2 && vars.TABWISE_OWNER_QUERY_PROBE_APPROVAL != ''
    runs-on: windows-2025
    timeout-minutes: 5
    env:
      TABWISE_OWNER_QUERY_PROBE_APPROVAL: ${{ vars.TABWISE_OWNER_QUERY_PROBE_APPROVAL }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24.22.1
      - run: node diagnostics/r2-native/probe-entry.mjs --check-only
      - name: One cold read-only PowerShell timing probe
        run: node diagnostics/r2-native/probe-entry.mjs --run
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: owner-query-probe-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/tabwise-probe-${{ github.run_id }}-2/
          if-no-files-found: warn
          retention-days: 14

