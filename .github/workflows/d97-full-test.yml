name: D97 full hosted npm test

on:
  push:
    branches:
      - ci/d97-fulltest-d73seal

permissions:
  contents: read

concurrency:
  group: d97-fulltest-d73seal
  cancel-in-progress: false

# The owner replaces CANDIDATE_SHA with the commit that carries the D73 seal correction before pushing this branch.
# CANDIDATE_TREE pins that commit's content: it was computed from the prepared diff on top of BASE_SHA.
env:
  CANDIDATE_SHA: 6867b9971810b4a676a268098ca0703418be597a
  CANDIDATE_TREE: 2675008b6e8ffd0766e79071c90f6d779a7e9206
  BASE_SHA: 52c97922069a93510699d02e9ddd38a7eb3b5a6f
  EXPECTED_TESTS: '1067'

jobs:
  full-test:
    if: github.ref == 'refs/heads/ci/d97-fulltest-d73seal' && github.run_attempt == 1
    runs-on: windows-2025
    timeout-minutes: 45

    steps:
      - name: Refuse an unset candidate
        shell: pwsh
        run: |
          if ($env:CANDIDATE_SHA -cnotmatch '^[0-9a-f]{40}$') {
            throw 'CANDIDATE_SHA is not a full commit SHA'
          }

      - name: Checkout exact candidate with full history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ env.CANDIDATE_SHA }}
          fetch-depth: 0
          persist-credentials: false

      - name: Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24.22.1

      - name: Verify candidate and record environment
        shell: pwsh
        run: |
          $head = (git rev-parse HEAD).Trim()
          if ($head -cne $env:CANDIDATE_SHA) {
            throw 'Wrong source commit'
          }
          $tree = (git rev-parse 'HEAD^{tree}').Trim()
          if ($tree -cne $env:CANDIDATE_TREE) {
            throw "Candidate tree $tree is not the prepared tree"
          }
          $parent = (git rev-parse 'HEAD^').Trim()
          if ($parent -cne $env:BASE_SHA) {
            throw "Candidate parent $parent is not the base commit"
          }
          $state = Get-Content scripts/tabwise/r2-status.json -Raw | ConvertFrom-Json
          if ($state.enabled -ne $false -or $state.verdict -cne 'BLOCK') {
            throw 'R2 must remain BLOCK'
          }
          $out = Join-Path $env:RUNNER_TEMP 'd97-full'
          New-Item -ItemType Directory -Force -Path $out | Out-Null
          @(
            "tested_sha=$head"
            "tested_tree=$tree"
            "base_sha=$parent"
            "workflow_sha=$env:GITHUB_SHA"
            "workflow_ref=$env:GITHUB_REF"
            "run_id=$env:GITHUB_RUN_ID"
            "run_attempt=$env:GITHUB_RUN_ATTEMPT"
            "image_os=$env:ImageOS"
            "image_version=$env:ImageVersion"
            "node=$(node --version)"
            "npm=$(npm --version)"
            "git=$(git --version)"
            "core.autocrlf=$(git config --get core.autocrlf)"
          ) | Set-Content (Join-Path $out 'identity.txt')

      - name: Install locked dependencies
        run: npm ci --ignore-scripts

      - name: Prepare Guidepup
        run: npx --no-install guidepup setup --ci

      - name: Install NVDA
        run: npx --no-install guidepup install nvda

      - name: Install Chromium
        run: npx --no-install playwright install chromium

      - name: Source preflight
        shell: pwsh
        run: |
          node scripts/preflight.mjs --clean --out "$env:RUNNER_TEMP/d97-full/before.json"
          if ($LASTEXITCODE -ne 0) { throw 'Source preflight failed' }

      - name: Make checkout read-only
        shell: pwsh
        run: |
          foreach ($f in (git ls-files)) {
            Set-ItemProperty -LiteralPath $f -Name IsReadOnly -Value $true
          }

      - name: Exact concurrent npm test and reporter-total validation
        timeout-minutes: 25
        shell: pwsh
        run: |
          $log = Join-Path $env:RUNNER_TEMP 'd97-full/npm-test.log'
          npm test 2>&1 | Tee-Object -FilePath $log
          $testExit = $LASTEXITCODE

          # Node 24 prints its run totals with the spec reporter as "<U+2139> <key> <n>", and with TAP as "# <key> <n>".
          # Every total must appear exactly once, in one of those two forms; anything else fails closed.
          $text = Get-Content $log -Raw -Encoding utf8
          $pattern = '(?m)^(?:' + [char]0x2139 + '|#) (tests|suites|pass|fail|cancelled|skipped|todo|duration_ms) ([0-9]+(?:\.[0-9]+)?)\r?$'
          $totals = [ordered]@{}
          $dupes = @()
          foreach ($m in [regex]::Matches($text, $pattern)) {
            $key = $m.Groups[1].Value
            if ($totals.Contains($key)) { $dupes += $key; continue }
            $totals[$key] = $m.Groups[2].Value
          }
          $totals['npm_exit'] = $testExit
          $totals | ConvertTo-Json -Compress |
            Set-Content "$env:RUNNER_TEMP/d97-full/test-totals.json"

          if ($dupes.Count) {
            throw "Ambiguous reporter totals: $($dupes -join ',')"
          }
          foreach ($key in @('tests','pass','fail','cancelled','skipped','todo')) {
            if (-not $totals.Contains($key) -or $totals[$key] -cnotmatch '^[0-9]+$') {
              throw "Missing reporter total: $key"
            }
          }
          if ($testExit -ne 0) {
            throw "npm test failed: $testExit"
          }
          $expected = [int]$env:EXPECTED_TESTS
          if ([int]$totals.tests -ne $expected -or
              [int]$totals.pass -ne $expected -or
              [int]$totals.fail -ne 0 -or
              [int]$totals.cancelled -ne 0 -or
              [int]$totals.skipped -ne 0 -or
              [int]$totals.todo -ne 0) {
            throw "Unexpected reporter totals: $($totals | ConvertTo-Json -Compress)"
          }

          Write-Host "D97 FULL TEST: $expected/$expected PASS"

      - name: Final source integrity
        if: always()
        shell: pwsh
        run: |
          node scripts/preflight.mjs --clean --out "$env:RUNNER_TEMP/d97-full/after.json"
          if ($LASTEXITCODE -ne 0) { throw 'Final source check failed' }

      - name: Upload diagnostic evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: d97-full-test-evidence
          path: ${{ runner.temp }}/d97-full/
          if-no-files-found: warn
          retention-days: 14
