name: D97 full hosted npm test

on:
  push:
    branches:
      - ci/d97-fulltest-e9a62d2

permissions:
  contents: read

concurrency:
  group: d97-fulltest-e9a62d2
  cancel-in-progress: false

jobs:
  full-test:
    if: github.ref == 'refs/heads/ci/d97-fulltest-e9a62d2' && github.run_attempt == 1
    runs-on: windows-2025
    timeout-minutes: 45

    steps:
      - name: Checkout exact candidate with full history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: e9a62d29fc62268cf68f4d7bca0e1e0e5dff4a98
          fetch-depth: 0
          persist-credentials: false

      - name: Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24.22.1

      - name: Verify candidate and record environment
        shell: pwsh
        run: |
          $head = (git rev-parse HEAD).Trim()
          if ($head -cne 'e9a62d29fc62268cf68f4d7bca0e1e0e5dff4a98') {
            throw 'Wrong source commit'
          }
          $state = Get-Content scripts/tabwise/r2-status.json -Raw | ConvertFrom-Json
          if ($state.enabled -ne $false -or $state.verdict -cne 'BLOCK') {
            throw 'R2 must remain BLOCK'
          }
          $out = Join-Path $env:RUNNER_TEMP 'd97-full'
          New-Item -ItemType Directory -Force -Path $out | Out-Null
          @(
            "tested_sha=$head"
            "workflow_sha=$env:GITHUB_SHA"
            "workflow_ref=$env:GITHUB_REF"
            "run_id=$env:GITHUB_RUN_ID"
            "run_attempt=$env:GITHUB_RUN_ATTEMPT"
            "image_os=$env:ImageOS"
            "image_version=$env:ImageVersion"
            "node=$(node --version)"
            "npm=$(npm --version)"
            "git=$(git --version)"
            "core.autocrlf=$(git config --get core.autocrlf)"
          ) | Set-Content (Join-Path $out 'identity.txt')

      - name: Install locked dependencies
        run: npm ci --ignore-scripts

      - name: Prepare Guidepup
        run: npx --no-install guidepup setup --ci

      - name: Install NVDA
        run: npx --no-install guidepup install nvda

      - name: Install Chromium
        run: npx --no-install playwright install chromium

      - name: Source preflight
        shell: pwsh
        run: |
          node scripts/preflight.mjs --clean --out "$env:RUNNER_TEMP/d97-full/before.json"
          if ($LASTEXITCODE -ne 0) { throw 'Source preflight failed' }

      - name: Make checkout read-only
        shell: pwsh
        run: |
          foreach ($f in (git ls-files)) {
            Set-ItemProperty -LiteralPath $f -Name IsReadOnly -Value $true
          }

      - name: Exact concurrent npm test and TAP validation
        timeout-minutes: 25
        shell: pwsh
        run: |
          $log = Join-Path $env:RUNNER_TEMP 'd97-full/npm-test.log'
          npm test 2>&1 | Tee-Object -FilePath $log
          $testExit = $LASTEXITCODE
          if ($testExit -ne 0) {
            throw "npm test failed: $testExit"
          }

          $tap = Get-Content $log -Raw
          $totals = @{}
          $pattern = '(?m)^# (tests|pass|fail|cancelled|skipped|todo) (\d+)\r?$'

          foreach ($m in [regex]::Matches($tap, $pattern)) {
            $totals[$m.Groups[1].Value] = [int]$m.Groups[2].Value
          }

          foreach ($key in @('tests','pass','fail','cancelled','skipped','todo')) {
            if (-not $totals.ContainsKey($key)) {
              throw "Missing TAP total: $key"
            }
          }

          $totals | ConvertTo-Json -Compress |
            Set-Content "$env:RUNNER_TEMP/d97-full/tap-totals.json"

          if ($totals.tests -ne 1065 -or
              $totals.pass -ne 1065 -or
              $totals.fail -ne 0 -or
              $totals.cancelled -ne 0 -or
              $totals.skipped -ne 0 -or
              $totals.todo -ne 0) {
            throw "Unexpected TAP totals: $($totals | ConvertTo-Json -Compress)"
          }

          Write-Host 'D97 FULL TEST: 1065/1065 PASS'

      - name: Final source integrity
        if: always()
        shell: pwsh
        run: |
          node scripts/preflight.mjs --clean --out "$env:RUNNER_TEMP/d97-full/after.json"
          if ($LASTEXITCODE -ne 0) { throw 'Final source check failed' }

      - name: Upload diagnostic evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: d97-full-test-evidence
          path: ${{ runner.temp }}/d97-full/
          if-no-files-found: warn
          retention-days: 14