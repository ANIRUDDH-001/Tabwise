# Standalone nonqualifying hosted NVDA startup diagnostic; never an R2/W2a authorization.
name: tabwise-nvda-startup-diagnostic
on:
  push:
    branches:
      - diag/tabwise-r2-startup
    paths:
      - .github/workflows/tabwise-nvda-startup-diagnostic.yml
      - scripts/tabwise/nvda-startup-diagnostic.mjs
permissions:
  contents: read
concurrency:
  group: tabwise-nvda-startup-diagnostic
  cancel-in-progress: false
jobs:
  startup:
    if: github.event_name == 'push' && github.ref == 'refs/heads/diag/tabwise-r2-startup' && github.run_attempt == 1
    runs-on: windows-2025
    timeout-minutes: 22
    steps:
      - name: Initialize failure report before setup
        timeout-minutes: 1
        shell: pwsh
        run: |
          $dir = Join-Path $env:RUNNER_TEMP 'tabwise-nvda-startup-diagnostic'
          New-Item -ItemType Directory -Force -Path $dir | Out-Null
          @{schema='tabwise-nvda-startup-diagnostic/1'; classification='NONQUALIFYING_STARTUP_DIAGNOSTIC'; pass=$false; stage='runner-setup'; w2a_qualified=$false; r2_capture_completed=$false; run_id=$env:GITHUB_RUN_ID; workflow_revision=$env:GITHUB_SHA; errors=@()} | ConvertTo-Json -Depth 5 | Set-Content -Encoding utf8NoBOM -LiteralPath (Join-Path $dir 'report.json')
      - name: Checkout the exact pushed revision
        timeout-minutes: 2
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Node 24
        timeout-minutes: 2
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.22.1
      - name: Install pinned dependencies without lifecycle scripts
        timeout-minutes: 3
        run: npm ci --ignore-scripts
      - name: Prepare GitHub-hosted Windows for Guidepup
        timeout-minutes: 3
        run: npx --no-install guidepup setup --ci
      - name: Install pinned NVDA using Guidepup
        timeout-minutes: 3
        run: npx --no-install guidepup install nvda
      - name: Validate diagnostic JavaScript syntax
        timeout-minutes: 1
        run: node --check scripts/tabwise/nvda-startup-diagnostic.mjs
      - name: Startup, settings, relay ownership, shutdown, and quiescence
        id: diagnostic
        timeout-minutes: 3
        run: node scripts/tabwise/nvda-startup-diagnostic.mjs
      - name: Preserve setup or interruption classification
        timeout-minutes: 1
        if: always()
        shell: pwsh
        env:
          DIAGNOSTIC_OUTCOME: ${{ steps.diagnostic.outcome }}
        run: |
          $file = Join-Path $env:RUNNER_TEMP 'tabwise-nvda-startup-diagnostic/report.json'
          $report = Get-Content -Raw -LiteralPath $file | ConvertFrom-Json
          if ($report.stage -eq 'runner-setup') {
            $report.errors = @(@{stage='runner-setup'; classification='SETUP_FAILED_OR_DIAGNOSTIC_NOT_STARTED'; message='Consult workflow step logs for the failed setup step'})
          }
          if ($env:DIAGNOSTIC_OUTCOME -ne 'success') { $report.pass = $false }
          $report | ConvertTo-Json -Depth 15 | Set-Content -Encoding utf8NoBOM -LiteralPath $file
      - name: Upload diagnostic report even on failure
        timeout-minutes: 1
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: nvda-startup-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/tabwise-nvda-startup-diagnostic/report.json
          if-no-files-found: error
          retention-days: 1
